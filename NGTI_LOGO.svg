<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Next Gen Tech Initiative Logo</title>
  <desc id="desc">A stylized gear-shaped emblem with a split robot face and the words NEXT GEN TECH INITIATIVE.</desc>

  <rect width="1024" height="1024" fill="#f4f4f4"/>

  <!-- Outer gear ring -->
  <g fill="#0d224c" stroke="#0b1020" stroke-width="12" stroke-linejoin="round">
    <rect x="470" y="70" width="84" height="120" rx="18"/>
    <rect x="470" y="834" width="84" height="120" rx="18"/>
    <rect x="70" y="470" width="120" height="84" rx="18"/>
    <rect x="834" y="470" width="120" height="84" rx="18"/>

    <rect x="180" y="160" width="84" height="120" rx="18" transform="rotate(-45 222 220)"/>
    <rect x="760" y="160" width="84" height="120" rx="18" transform="rotate(45 802 220)"/>
    <rect x="180" y="744" width="84" height="120" rx="18" transform="rotate(45 222 804)"/>
    <rect x="760" y="744" width="84" height="120" rx="18" transform="rotate(-45 802 804)"/>

    <rect x="122" y="300" width="120" height="84" rx="18" transform="rotate(-30 182 342)"/>
    <rect x="782" y="300" width="120" height="84" rx="18" transform="rotate(30 842 342)"/>
    <rect x="122" y="640" width="120" height="84" rx="18" transform="rotate(30 182 682)"/>
    <rect x="782" y="640" width="120" height="84" rx="18" transform="rotate(-30 842 682)"/>
  </g>

  <circle cx="512" cy="512" r="356" fill="#0d224c" stroke="#0b1020" stroke-width="14"/>
  <circle cx="512" cy="512" r="300" fill="#f2f3f5" stroke="#0b1020" stroke-width="14"/>

  <!-- Split robot face -->
  <g stroke="#0b1020" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
    <path d="M218 324 H512 V610 H218 Z" fill="#f3d44d"/>
    <path d="M512 324 H806 V610 H512 Z" fill="#7ec8f5"/>

    <path d="M218 610 H512 V714 H218 Z" fill="#f3d44d"/>
    <path d="M512 610 H806 V714 H512 Z" fill="#7ec8f5"/>

    <!-- jaw and teeth -->
    <path d="M324 700 H700 V780 H324 Z" fill="#f4f4f4"/>
    <path d="M360 780 H664 V850 H360 Z" fill="#f4f4f4"/>

    <path d="M264 712 L476 712 L476 780 L264 780 Z" fill="#f4f4f4"/>
    <path d="M548 712 H760 V780 H548 Z" fill="#f4f4f4"/>

    <g fill="#f4f4f4">
      <rect x="300" y="700" width="46" height="80" rx="8"/>
      <rect x="356" y="700" width="46" height="80" rx="8"/>
      <rect x="412" y="700" width="46" height="80" rx="8"/>
      <rect x="468" y="700" width="46" height="80" rx="8"/>
      <rect x="524" y="700" width="46" height="80" rx="8"/>
      <rect x="580" y="700" width="46" height="80" rx="8"/>
      <rect x="636" y="700" width="46" height="80" rx="8"/>
      <rect x="692" y="700" width="46" height="80" rx="8"/>
    </g>

    <!-- eye accents -->
    <g>
      <circle cx="330" cy="456" r="74" fill="#0d224c"/>
      <circle cx="330" cy="456" r="30" fill="#f3d44d"/>
      <circle cx="330" cy="456" r="16" fill="#0d224c"/>

      <circle cx="694" cy="456" r="74" fill="#0d224c"/>
      <circle cx="694" cy="456" r="30" fill="#7ec8f5"/>
      <circle cx="694" cy="456" r="16" fill="#0d224c"/>
    </g>

    <!-- face features -->
    <path d="M230 430 H286 V500 H230 Z" fill="#f4f4f4"/>
    <path d="M738 430 H794 V500 H738 Z" fill="#f4f4f4"/>

    <path d="M218 324 Q512 250 806 324 V356 H218 Z" fill="#f2f3f5"/>
    <path d="M514 324 L612 460 L514 610 L416 460 Z" fill="#f4f4f4"/>

    <circle cx="512" cy="512" r="105" fill="none"/>
    <path d="M392 540 L512 600 L632 540" fill="none"/>
  </g>

  <!-- Text -->
  <g fill="#0d224c" font-family="Verdana, Arial, sans-serif" font-weight="700" letter-spacing="2">
    <text x="512" y="900" text-anchor="middle" font-size="54" transform="rotate(-8 512 900)">NEXT GEN TECH</text>
    <text x="512" y="968" text-anchor="middle" font-size="54" transform="rotate(-8 512 968)">INITIATIVE</text>
  </g>
</svg>
